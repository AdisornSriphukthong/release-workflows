<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Two GitHub Actions workflow files that turn a version bump into a tagged GitHub Release for any npm project. Download, drop in, ship."
    />
    <title>Release Workflows</title>

    <!-- Requested here rather than via @import in CSS: an @import is only
         discovered after the stylesheet parses, which puts webfonts behind the
         whole CSS bundle. preconnect opens both connections up front. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&family=JetBrains+Mono:wght@400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
