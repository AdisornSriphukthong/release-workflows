# ─────────────────────────────────────────────────────────────────────────────
# Lint and build on every push and pull request, so a broken commit is caught
# before it can be merged and turned into a release tag.
#
# Set PACKAGE_MANAGER below to match release.yml, change the branch names to
# match your repository, and drop the lint step if your project has no lint
# script.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  # One of: npm | yarn | pnpm — keep this in step with release.yml.
  PACKAGE_MANAGER: npm

# A newer push to the same branch or PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # corepack provides the yarn and pnpm binaries, and setup-node needs them
      # on PATH before it can cache their stores.
      - name: Enable corepack
        if: env.PACKAGE_MANAGER != 'npm'
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: ${{ env.PACKAGE_MANAGER }}

      - name: Install dependencies
        run: |
          case "$PACKAGE_MANAGER" in
            yarn)
              # Yarn 1 and Yarn 2+ spell the same flag differently.
              if [ "$(yarn --version | cut -d. -f1)" = "1" ]; then
                yarn install --frozen-lockfile
              else
                yarn install --immutable
              fi
              ;;
            pnpm) pnpm install --frozen-lockfile ;;
            *)    npm ci ;;
          esac

      - name: Lint
        run: $PACKAGE_MANAGER run lint

      # For a TypeScript project whose build script is `tsc -b && …`, this is
      # the type-check too.
      - name: Build
        env:
          NODE_ENV: production
        run: $PACKAGE_MANAGER run build
