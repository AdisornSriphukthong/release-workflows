# ─────────────────────────────────────────────────────────────────────────────
# Manual release for a Node project.
#
# Actions > Release > Run workflow, pick patch / minor / major. The job bumps
# package.json, tags vX.Y.Z, builds, and publishes a GitHub Release with the
# built output attached.
#
# BEFORE FIRST USE, check these four things:
#   1. PACKAGE MANAGER — set PACKAGE_MANAGER below to npm, yarn or pnpm.
#   2. RELEASE BRANCH  — this file says `main` in two places (the checkout `ref`
#      and the final `git push`). Change both if you release from `master`.
#   3. BUILD OUTPUT    — the "Package build output" step zips `dist/`. Change it
#      if your build writes somewhere else (`build/`, `out/`, …).
#   4. SCRIPTS         — the job runs your `lint` and `build` scripts. Drop the
#      lint step if your project has none.
#
# The workflow file must live on your repository's DEFAULT branch or the
# "Run workflow" button never appears — workflow_dispatch reads it from there.
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (patch = 0.0.X, minor = 0.X.0, major = X.0.0)"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

env:
  # ── Package manager ────────────────────────────────────────────────────────
  # One of: npm | yarn | pnpm
  #
  # This single value drives the dependency cache, the install command and how
  # the lint and build scripts are run. Nothing else in this file changes.
  #
  # The version bump deliberately stays on `npm version` whichever you pick:
  # npm ships with Node, and it is the one bump command that writes both the
  # commit and the tag itself. It leaves yarn.lock and pnpm-lock.yaml alone and
  # does not create a package-lock.json.
  PACKAGE_MANAGER: npm

# Needed to push the version commit/tag and to create the Release.
permissions:
  contents: write

# Two releases at once would race on the version commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      # Always release from the release branch, whatever branch the workflow
      # was launched from. fetch-depth 0 so release notes can see prior tags.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # corepack ships with Node and provides the yarn and pnpm binaries.
      # It has to run before setup-node, which needs them on PATH to work out
      # where their caches live.
      - name: Enable corepack
        if: env.PACKAGE_MANAGER != 'npm'
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: ${{ env.PACKAGE_MANAGER }}

      - name: Install dependencies
        run: |
          case "$PACKAGE_MANAGER" in
            yarn)
              # Yarn 1 and Yarn 2+ spell the same flag differently.
              if [ "$(yarn --version | cut -d. -f1)" = "1" ]; then
                yarn install --frozen-lockfile
              else
                yarn install --immutable
              fi
              ;;
            pnpm) pnpm install --frozen-lockfile ;;
            *)    npm ci ;;
          esac

      - name: Lint
        run: $PACKAGE_MANAGER run lint

      # Creates the version commit and annotated tag on the runner only.
      # Nothing is pushed until the build below succeeds, so a failed build
      # never leaves a half-finished tag behind in the repository.
      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version=$(npm version "${{ inputs.bump }}" -m "chore(release): %s")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          NODE_ENV: production
          # Build-time config goes here. Repository variables live under
          # Settings > Secrets and variables > Actions > Variables:
          #
          #   VITE_API_URL: ${{ vars.VITE_API_URL }}
          #
          # Anything a client bundle inlines is public once shipped, so use a
          # variable, not a secret — and never expose a real secret here.
        run: $PACKAGE_MANAGER run build

      - name: Package build output
        run: cd dist && zip -r "../dist-${{ steps.bump.outputs.version }}.zip" .

      - name: Push version commit and tag
        run: git push --follow-tags origin main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.version }}" \
            --title "${{ steps.bump.outputs.version }}" \
            --generate-notes \
            "dist-${{ steps.bump.outputs.version }}.zip"
